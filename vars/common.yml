# Common/shared variables
variables:
  service: mcp
  serviceConnection: sc-azure-vse-shared-sub-wif-001
  gitHubServiceConnection: wesley-trust

  # Tag configuration
  owner: platform-team

  # Resource Group configuration
  deployResourceGroup: true # Setting to false will prevent creation, any resources deployed will be detached or deleted as per the allowDeleteOnUnmanage pipeline parameter, any dependent resources will fail to deploy
  deploymentVersion: 001
  resourceGroup: rg-$(service)-$(environment)-$(regionCode)-$(deploymentVersion)

  # Service configuration
  deployService: true # Setting to false skips the Function App deployment entirely, any resources deployed will be detached or deleted as per the allowDeleteOnUnmanage pipeline parameter

  ## Function App configuration
  deployFunctionApp: true # Setting to false will prevent creation of the Function App and dependencies, any resources deployed will be detached or deleted as per the allowDeleteOnUnmanage pipeline parameter
  mcpInstanceVersion: 001
  mcpPlanInstanceVersion: 001
  mcpStorageAccountInstanceVersion: 001

  mcpName: func-$(service)-$(environment)-$(regionCode)-$(mcpInstanceVersion)
  mcpPlanName: plan-$(service)-$(environment)-$(regionCode)-$(mcpPlanInstanceVersion)
  mcpStorageAccountName: st$(service)$(environment)$(regionCode)$(mcpStorageAccountInstanceVersion)
  mcpDeploymentContainerName: apppkg-$(service)-$(environment)-$(regionCode)

  mcpMaximumInstanceCount: 100
  mcpInstanceMemoryMB: 2048
  mcpRuntime: powerShell
  mcpRuntimeVersion: "7.4"
  mcpAlwaysReadyDurableCount: 0
  mcpPlanZoneRedundant: "false"
  mcpUserPrincipalId: ""
  mcpAllowUserPrincipal: "false"

  ## Virtual Network configuration
  vNetInstanceVersion: 001
  networkDeploymentVersion: 001
  networkService: "network"
  networkResourceGroup: rg-$(networkService)-$(environment)-$(regionCode)-$(networkDeploymentVersion)

  ### Virtual Network: vnet-001
  vnet-001-name: vnet-$(networkService)-$(environment)-$(regionCode)-$(vNetInstanceVersion)

  ### Subnet configuration
  subnetInstanceVersion: 001

  ### Subnet: snet-002
  snet-002-resource: "mcp"
  snet-002-name: snet-$(networkService)-$(environment)-$(regionCode)-vnet-$(vNetInstanceVersion)-$(snet-002-resource)-$(subnetInstanceVersion)
